<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/Style/sbm.css">
    <link rel="icon" href="/public/rawr/icon3.svg">
    <title>"Submission"</title>
</head>

<body>
    <img src="/rawr/icon3.svg" class="logo" alt="logo">
    

      <h1>Submission</h1>

                        <p id="notice" class="notice"  >
                            SignIn or SignUp to be able to submit your forms.
                            <a href="/User/Signin.html">SignIn</a>
                            <a href="/User/Signup.html">SignUp</a>
                        </p>
                    <p id="who" class="meta" hidden></p>

        <main class="layout">

                <section class="left">
                    <form id="upload-form" class="panel"
                        

                        <label for="file">Select Form or File:</label>
                        <input type="file" id="file" name="selectform" required>

                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" required>

                        <label for="description">Description:</label>
                        <textarea id="description" name="description" rows="6"></textarea>

                        <p id="message" role="status"></p>

                        <div class="actions">
                            <button type="submit" id="submit" hidden>SUBMIT</button>
                        </div>

                    </form>

                    <div class="actions">
                        <h2>Ensure that your file of choice is correct before submission.</h2>
                        <ul id="list"></ul>
                    </div>

                </section>

                <aside class="right panel" id="details">
                    <p class="empty">Select any submitted file to see its description.</p>
                </aside>

        </main>     
        
                        


          
           <nav class="nav-buttons"> 
                <a href="/User/FPage.html"><button type="button">HOME</button></a>
                
                
            </nav> 
            
            
            <script src="/Script/sscript.js"></script>
</body>
</html>
