<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
      <link rel="stylesheet" href="/Style/ide.css">
      <link rel="icon" href="/rawr/solid-student-graduating.svg">

      <title>Sign Up</title>

</head>
  <body class="signup">

    
    <img src="/rawr/solid-student-graduating.svg" class="logo" alt="logo">
    
    
    <div class="page">

          <h1>SIGN UP</h1>

          

        <form class="signup" id="signup-form">

           <div class="form-container">
              <label for="email">Email:</label>
              <input type="text" id="email" name="Email" required>
          
              <label for="username">Username:</label>
              <input type="text" id="username" name="username" required>
          
              <label for="password">Password:</label>
              <input type="password" id="password" name="password" required>
          
              <label for="verifypassword">Verify password:</label>
              <input type="password" id="verifypassword" name="verifypassword" required>

              <p id="message" role="alert"></p>
              <button type="submit">Sign Up</button>
            </div>
              
          <div class="button-wrap">
            
          
            <a href="/User/Submission.html"><button>SUBMISSION</button></a>
            <button onclick="history.back()">BACK</button>
          </div>
        
        
         </form>
    </div>
    
      <script src="/Script/script.js"></script>
      
  </body>
</html
