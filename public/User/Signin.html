<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/Style/ide.css">
    <link rel="icon" href="/rawr/solid-student-graduating.svg">
    <title>SIGN IN</title>
</head>

    <body class="signin">

        <img src="/rawr/solid-student-graduating.svg" class="logo" alt="logo">

        <div class="page">
            <h1>SIGN IN</h1>


          <form id="signin-form" >
            <div class="form-container">

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                
                <p id="message" role="alert"></p>

                <button type="submit" class="button">Sign In</button>

            </div>
            
            <div class="button-wrap">
                <a href="/User/FPage.html"><button type="button">HOME</button></a>
                <a href="/User/Submission.html"><button type="button">SUBMISSION</button></a>
                
            </div>
         </form>


        </div>
     <script src="/Script/script.js"></script>
    </body>
</html
